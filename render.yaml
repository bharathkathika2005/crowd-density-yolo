services:
  - type: web
    name: crowd-density-yolo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 600 app:app
    healthCheckPath: /healthz
    envVars:
      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics
      - key: YOLO_IMAGE_SIZE
        value: "320"
